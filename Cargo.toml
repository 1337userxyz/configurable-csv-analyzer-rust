[package]
name = "configurable_csv_analyzer"
version = "0.1.0"
edition = "2021"

[lib]
name = "configurable_csv_analyzer"
path = "src/lib.rs"

[[bin]]
name = "configurable_csv_analyzer"
path = "src/main.rs"
required-features = ["ods"]

[features]
default = ["ods"]
ods = ["dep:calamine", "dep:zip"]
build = ["dep:slint-build", "kit-theme/build"]

[dependencies]
slint = "1.18"
slint-build = { version = "1.18", optional = true }
csv = "1.3"
encoding_rs = "0.8"
calamine = { version = "0.38", optional = true }
zip = { version = "9.3", default-features = false, features = ["deflate"], optional = true }
arboard = "3.4"
natord = "1.0"
evalexpr = "13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8.0"
rayon = "1.10"
kit-dialog = { path = "../rust-kit/crates/kit-dialog", version = "0.1.0" }
kit-fs = { path = "../rust-kit/crates/kit-fs", version = "0.1.0" }
kit-csv = { path = "../rust-kit/crates/kit-csv", version = "0.1.0" }
kit-logging = { path = "../rust-kit/crates/kit-logging", version = "0.1.0" }
kit-launcher = { path = "../rust-kit/crates/kit-launcher", version = "0.1.0" }
kit-slint = { path = "../slint-desktop-kit/crates/kit-slint", version = "0.1.0" }
kit-theme = { path = "../slint-desktop-kit/crates/kit-theme", version = "0.1.0", features = ["serde"] }
log = "0.4"
chrono = "0.4"

[build-dependencies]
kit-theme = { path = "../slint-desktop-kit/crates/kit-theme", version = "0.1.0", features = ["build"] }
