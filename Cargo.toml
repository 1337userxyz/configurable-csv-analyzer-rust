[package]
name = "configurable_csv_analyzer"
version = "0.1.0"
edition = "2021"

[lib]
name = "configurable_csv_analyzer"
path = "src/lib.rs"

[[bin]]
name = "configurable_csv_analyzer"
path = "src/main.rs"

[dependencies]
slint = "1.18"
csv = "1.3"
encoding_rs = "0.8"
calamine = "0.38"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
arboard = "3.4"
natord = "1.0"
evalexpr = "13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
notify = "8.0"
rayon = "1.10"
kit-picker = { path = "../slint-desktop-kit/crates/kit-picker", version = "0.1.0" }
kit-paths = { path = "../slint-desktop-kit/crates/kit-paths", version = "0.1.0" }
kit-slint = { path = "../slint-desktop-kit/crates/kit-slint", version = "0.1.0" }
kit-logging = { path = "../slint-desktop-kit/crates/kit-logging", version = "0.1.0" }
kit-launcher = { path = "../slint-desktop-kit/crates/kit-launcher", version = "0.1.0" }
kit-theme = { path = "../slint-desktop-kit/crates/kit-theme", version = "0.1.0", features = ["serde"] }
rfd = "0.17"
log = "0.4"
chrono = "0.4"

[build-dependencies]
slint-build = "1.18"
kit-theme = { path = "../slint-desktop-kit/crates/kit-theme", version = "0.1.0" }
